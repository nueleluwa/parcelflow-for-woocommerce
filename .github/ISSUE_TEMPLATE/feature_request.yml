name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API support
      description: |
        Does this rely on a ParcelFlow API field or endpoint? Link the documentation. The plugin does not
        implement undocumented API behaviour.
